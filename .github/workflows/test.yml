name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  LOCAL_IMAGE: app:${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mytestdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/mytestdb
      JWT_SECRET_KEY: ci-access-secret-key-not-used-in-production
      JWT_REFRESH_SECRET_KEY: ci-refresh-secret-key-not-used-in-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Run tests
        run: pytest --junitxml=test-results/junit.xml --cov-fail-under=100

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            htmlcov/
          if-no-files-found: warn

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.LOCAL_IMAGE }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 1

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

  push:
    needs: scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the scanned image
        run: |
          set -euo pipefail
          docker load --input /tmp/image.tar
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/module13_is601"
          docker tag "$LOCAL_IMAGE" "$REPO:latest"
          docker tag "$LOCAL_IMAGE" "$REPO:${{ github.sha }}"
          docker push "$REPO:latest"
          docker push "$REPO:${{ github.sha }}"

  smoke:
    needs: push
    runs-on: ubuntu-latest
    environment: production
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start the pushed image
        run: |
          set -euo pipefail
          docker run -d --name smoke --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/fastapi_db \
            -e JWT_SECRET_KEY=smoke-access-secret-key \
            -e JWT_REFRESH_SECRET_KEY=smoke-refresh-secret-key \
            "${{ secrets.DOCKERHUB_USERNAME }}/module13_is601:${{ github.sha }}"

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Register and log in
        run: |
          set -euo pipefail
          USER="smoke_${{ github.run_id }}"
          curl -fsS -X POST http://localhost:8000/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"first_name\":\"Smoke\",\"last_name\":\"Test\",\"email\":\"$USER@example.com\",\"username\":\"$USER\",\"password\":\"SecurePass123!\",\"confirm_password\":\"SecurePass123!\"}"
          curl -fsS -X POST http://localhost:8000/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$USER\",\"password\":\"SecurePass123!\"}" \
            | grep -q access_token

      - name: Container logs
        if: failure()
        run: docker logs smoke
